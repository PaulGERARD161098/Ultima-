  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="css/styles.css">

  <!-- LV5 — le ciel. `ciel.css` est réemployée telle quelle (même scène, même
       étoile qu'à RIVEN) ; `stellaire.css` vient EN DERNIER car elle redéfinit

  <link rel="stylesheet" href="css/ciel-noeud.css">
  <link rel="stylesheet" href="css/stellaire.css">
  <link rel="stylesheet" href="css/leo.css">

<!-- TAO — la voie (Lv3, boucle L3). L'arborescence tronc + deux branches a laissé
     place à la FORME UNIQUE : la boussole. Coque pure — les deux caps, la
     passerelle « ⇄ rétroplanning » (tracée en ARC, sinon une corde entre deux
     caps opposés passerait derrière le médaillon) et la parole de Léo sont
     rendus par js/boussole-noyau.mjs à partir du registre (`data-noeud`). -->
<body class="ciel-noeud" data-noeud="tao">

  <div class="ciel-noeud-coque">

    <!-- Retour à la supra-division ULTIMA (Lv3 : TAO en est un cap). -->
    <p class="console-retour boussole-retour"><a href="naga.html">↞ NAGA</a></p>

    <!-- ===== Bandeau : sceau TAO (le yin-yang gravé) ===== -->
    <header class="console-entete boussole-entete">
      <svg class="boussole-sceau" viewBox="0 0 72 72" aria-hidden="true" focusable="false">
        <circle cx="36" cy="36" r="33" fill="#f9f1dc" stroke="#a9884a" stroke-width="2.4"/>
        <circle cx="36" cy="36" r="28.5" fill="none" stroke="#5a4118" stroke-width="1"/>
        <!-- Yin-yang gravé : le réel (RESHIRAM) et l'idéal (ZEKROM), une seule voie. -->
        <circle cx="36" cy="36" r="24" fill="#efe3c4" stroke="#5a4118" stroke-width="1"/>
        <path d="M36 12 A24 24 0 0 1 36 60 A12 12 0 0 1 36 36 A12 12 0 0 0 36 12 Z" fill="#3b2f1c"/>
        <circle cx="36" cy="24" r="4.5" fill="#efe3c4"/>
        <circle cx="36" cy="48" r="4.5" fill="#3b2f1c"/>
      </svg>

      <h1 class="console-titre console-titre--boussole">
        <span class="titre-surligne">Ultima — quadrant Tao</span>
        <span class="titre-principal">La voie</span>
      </h1>
    </header>

    <!-- ===== La boussole des deux pôles, rendue par le noyau ===== -->
    <div class="ciel-noeud-plateau" id="ciel-noeud-plateau">
      <main class="ciel-scene" id="ciel-noeud-scene"
            aria-label="Boussole du quadrant TAO : le réel et l'idéal">
      </main>
      <!-- Le repli sans JavaScript vit DANS LE PLATEAU, à côté de la scène :
           le moteur vide la scène à chaque dessin. -->
      <!-- Repli sans JavaScript : les deux pôles restent atteignables. -->
      <noscript>
        <ul class="boussole-noscript">
          <li><a href="reshiram.html">RESHIRAM — le travail de la réalité</a></li>
          <li><a href="zekrom.html">ZEKROM — la quête de l'idéal</a></li>
          <li>Les deux sont reliés par le rétroplanning.</li>
        </ul>
      </noscript>
    </div>

    <!-- Parole de Léo : l'essentiel du cap survolé (rempli par le noyau). -->
    <aside class="boussole-parole" id="boussole-parole" role="status" aria-live="polite">
    </aside>

  </div>

  <!-- LV5 — la couche de fond AVANT le moteur : celui-ci la cherche en global au
       moment du rendu, et son garde laisserait la page vivre SANS fond et sans
       rien dire (défaut payé sur P1). Le harnais exige donc le canvas. -->
  <script src="js/ciel-fond.js"></script>
  <script src="js/ciel.js"></script>
  <script type="module" src="js/ciel-noeud.mjs"></script>
  <script src="js/vendor/supabase-js-2.110.0.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/leo-accueil.js"></script>
  <script src="js/leo-partout.js"></script>
</body>
</html>
