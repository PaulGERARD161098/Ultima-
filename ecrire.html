<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Ultima — Écrire</title>
  <meta name="description" content="La capture d'une page de journal MINETHNIR — privée, derrière authentification.">
  <meta name="theme-color" content="#0e3a52">
  <!-- Ajoutée à l'écran d'accueil, cette page s'ouvre SEULE et en plein écran :
       c'est tout le propos de la boucle ② (« deux gestes du pouce »). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Écrire">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23241c12'/%3E%3Cpath d='M10 21 L20 11 M18 9 l3 3' stroke='%23e8cf8f' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/ecrire.css">
</head>
<body class="ecrire">

  <!-- ===== LA CAPTURE (boucle ②, dictée Paul 2026-08-01).
       Diagnostic de la boucle ① : le journal est vide parce que le cap n'est
       pas atteignable au moment où l'envie d'écrire arrive — elle surgit en
       marchant, au pouce et à la voix. Cette page est la réponse : une seule
       chose à l'écran, le champ déjà prêt, un seul geste pour envoyer.
       AUCUNE donnée en dur, aucun mode démo (§5 : intime). ===== -->

  <main class="ecrire-scene" aria-label="Écrire une page de journal">

    <p id="ecrire-chargement" class="ecrire-etat">Ouverture…</p>

    <section id="ecrire-auth" class="ecrire-bloc" hidden>
      <h1 class="ecrire-titre">Ta session s’est refermée</h1>
      <p>Ce que tu écris ici est intime&nbsp;: il faut ta session pour l’ouvrir.</p>
      <p><a class="ecrire-lien" href="/">Se reconnecter</a></p>
    </section>

    <form id="ecrire-form" class="ecrire-bloc" hidden novalidate>
      <!-- Pas de titre : décision de Paul (2026-08-01). Une capture au pouce ne
           doit rien demander avant le premier mot. Le titre reste disponible
           dans l'atelier posé (minethnir.html). -->
      <label class="ecrire-label" for="ecrire-contenu">Ce qui vient</label>
      <textarea id="ecrire-contenu" name="contenu" class="ecrire-champ"
                rows="10" maxlength="20000" autocomplete="off"
                autocapitalize="sentences" spellcheck="true"
                placeholder="dicte ou écris…"></textarea>

      <button type="submit" id="ecrire-envoyer" class="ecrire-envoyer">Déposer</button>

      <p id="ecrire-message" class="ecrire-message" role="status" aria-live="polite"></p>

      <p class="ecrire-pied">
        <a class="ecrire-lien" href="minethnir.html">Ouvrir le journal ↝</a>
      </p>
    </form>

  </main>

  <script src="js/vendor/supabase-js-2.110.0.min.js"></script>
  <script src="js/config.js"></script>
  <!-- La dictée partagée : un micro apparaît si le navigateur expose l'API.
       Là où elle manque (iOS notamment), la dictée clavier du système fait le
       travail dans ce champ ordinaire — c'est prévu, pas subi. -->
  <script src="js/dictee.js"></script>
  <script src="js/ecrire.js"></script>
</body>
</html>
