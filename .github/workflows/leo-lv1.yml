name: Léo LV1 — fixtures isolées
on:
  pull_request:
    paths:
      - 'api/**'
      - 'js/**'
      - 'finubar/**'
      - 'leo/**'
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/leo-lv1.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  registre-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Préparer Postgres 17 hors du bac à sable
        run: |
          docker pull postgres:17-bookworm
          docker image inspect --format '{{.Id}}' postgres:17-bookworm > /tmp/lv1-postgres-image-id
      - name: Éprouver la concurrence entre connexions Postgres fictives
        run: |
          LV1_POSTGRES_IMAGE="$(cat /tmp/lv1-postgres-image-id)"
          echo "Image utilisée : $LV1_POSTGRES_IMAGE"
          docker run --rm --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 999:999 --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --mount type=bind,src="$GITHUB_WORKSPACE/leo",dst=/workspace/leo,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/tests",dst=/workspace/tests,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/supabase",dst=/workspace/supabase,readonly \
            --workdir /workspace --env LV1_PG_ISOLATED=1 \
            --entrypoint bash "$LV1_POSTGRES_IMAGE" tests/leo-registre-postgres.sh
  registre:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Préparer le moteur SQL fictif
        run: |
          docker pull node:22-bookworm
          docker image inspect --format '{{.Id}}' node:22-bookworm > /tmp/lv1-registre-image-id
      - name: Éprouver API et Postgres fictif sans réseau ni secrets
        run: |
          LV1_REGISTRE_IMAGE="$(cat /tmp/lv1-registre-image-id)"
          echo "Image utilisée : $LV1_REGISTRE_IMAGE"
          docker run --rm --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 1g --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777 \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/travail,readonly \
            --tmpfs /travail/.git:ro,nosuid,nodev,noexec,size=1m \
            --tmpfs /travail/memoire:ro,nosuid,nodev,noexec,size=1m \
            --workdir /travail "$LV1_REGISTRE_IMAGE" \
            sh -eu -c 'node tests/lv1-isolation.mjs; node tests/unit-leo-registre-api.mjs; node tests/unit-leo-registre-sql.mjs; node tests/unit-leo-registre-parcours.mjs'
  lv1:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Préparer le moteur hors du bac à sable
        run: |
          docker pull node:22-bookworm-slim
          docker image inspect --format '{{.Id}}' node:22-bookworm-slim > /tmp/lv1-image-id
      - name: Éprouver les fixtures sans réseau ni secrets
        run: |
          export LV1_NODE_IMAGE="$(cat /tmp/lv1-image-id)"
          echo "Image utilisée : $LV1_NODE_IMAGE"
          bash tests/lancer-lv1-isole.sh
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Préparer Python et Git hors du bac à sable
        run: |
          docker pull python:3.12-bookworm
          docker image inspect --format '{{.Id}}' python:3.12-bookworm > /tmp/lv1-python-image-id
          docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-bookworm > /tmp/lv1-python-image-digest
      - name: Éprouver le runtime et ses processus enfants sans réseau ni secrets
        run: |
          LV1_PYTHON_IMAGE="$(cat /tmp/lv1-python-image-id)"
          echo "Image utilisée : $LV1_PYTHON_IMAGE"
          docker run --rm --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777 \
            --mount type=bind,src="$GITHUB_WORKSPACE/leo",dst=/workspace/leo,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/finubar/leo_control.py",dst=/workspace/finubar/leo_control.py,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/finubar/leo_process.py",dst=/workspace/finubar/leo_process.py,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/tests/runtime",dst=/workspace/tests/runtime,readonly \
            --workdir /workspace \
            --env LV1_ISOLATED=1 --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_GLOBAL=/dev/null --env GIT_CONFIG_NOSYSTEM=1 \
            "$LV1_PYTHON_IMAGE" \
            sh -eu -c 'git --version; python -m unittest discover -s tests/runtime -p "test_*.py" -v'
      - name: Construire le kit candidat inerte dans le bac à sable
        env:
          LV1_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          LV1_TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          LV1_INTEGRATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export LV1_PINNED_IMAGE="$(cat /tmp/lv1-python-image-digest)"
          LV1_PYTHON_IMAGE="$(cat /tmp/lv1-python-image-id)"
          LV1_KIT_OUTPUT="$(mktemp -d "$RUNNER_TEMP/leo-kit.XXXXXX")"
          echo "LV1_KIT_OUTPUT=$LV1_KIT_OUTPUT" >> "$GITHUB_ENV"
          docker run --rm --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777 \
            --mount type=bind,src="$GITHUB_WORKSPACE/leo",dst=/workspace/leo,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/finubar/leo_control.py",dst=/workspace/finubar/leo_control.py,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/finubar/leo_process.py",dst=/workspace/finubar/leo_process.py,readonly \
            --workdir /workspace --env PYTHONDONTWRITEBYTECODE=1 \
            --env LV1_SOURCE_SHA --env LV1_TARGET_SHA --env LV1_INTEGRATION_SHA --env LV1_PINNED_IMAGE \
            "$LV1_PYTHON_IMAGE" \
            sh -eu -c 'python -m leo.control_r21.pilot_build --source /workspace --output /tmp/pilot --source-sha "$LV1_SOURCE_SHA" --target-sha "$LV1_TARGET_SHA" --integration-sha "$LV1_INTEGRATION_SHA" --image "$LV1_PINNED_IMAGE" >&2; tar -czf /tmp/pilot.tar.gz -C /tmp pilot; base64 -w0 /tmp/pilot.tar.gz' \
            | head -c 2097153 > "$LV1_KIT_OUTPUT/encoded"
          test "$(wc -c < "$LV1_KIT_OUTPUT/encoded")" -le 2097152
          base64 --decode "$LV1_KIT_OUTPUT/encoded" > "$LV1_KIT_OUTPUT/pilot.tar.gz"
          sha256sum "$LV1_KIT_OUTPUT/pilot.tar.gz"
      - name: Conserver le kit sans l’installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leo-pilot-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ env.LV1_KIT_OUTPUT }}/pilot.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Préparer le dossier R21 sans fusion ni accord simulé
        env:
          LV1_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          LV1_TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          LV1_INTEGRATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LV1_PYTHON_IMAGE="$(cat /tmp/lv1-python-image-id)"
          LV1_TRIAL_OUTPUT="$(mktemp -d "$RUNNER_TEMP/leo-r21.XXXXXX")"
          echo "LV1_TRIAL_OUTPUT=$LV1_TRIAL_OUTPUT" >> "$GITHUB_ENV"
          docker run --rm --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777 \
            --mount type=bind,src="$GITHUB_WORKSPACE/leo",dst=/workspace/leo,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/finubar/leo_control.py",dst=/workspace/finubar/leo_control.py,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/finubar/leo_process.py",dst=/workspace/finubar/leo_process.py,readonly \
            --tmpfs /trial-output:rw,nosuid,nodev,noexec,size=128m,mode=1777 \
            --workdir /workspace \
            --env LV1_ISOLATED=1 --env PYTHONDONTWRITEBYTECODE=1 \
            --env LV1_SOURCE_SHA --env LV1_TARGET_SHA --env LV1_INTEGRATION_SHA \
            --env GIT_CONFIG_GLOBAL=/dev/null --env GIT_CONFIG_NOSYSTEM=1 \
            "$LV1_PYTHON_IMAGE" \
            sh -eu -c 'python -m leo.trial prepare --output /trial-output/trial --source-sha "$LV1_SOURCE_SHA" --target-sha "$LV1_TARGET_SHA" --integration-sha "$LV1_INTEGRATION_SHA" >&2; python -m leo.trial inspect /trial-output/trial >&2; python -c "import base64,pathlib,sys; sys.stdout.buffer.write(base64.b64encode(pathlib.Path(\"/trial-output/trial.tar.gz\").read_bytes()))"' \
            | head -c 2097153 > "$LV1_TRIAL_OUTPUT/encoded"
          # Lanceur de confiance : aucune extraction ni exécution du paquet sur l'hôte.
          python3 - "$LV1_TRIAL_OUTPUT" <<'PYTHON'
          import base64, gzip, io, pathlib, tarfile
          root = pathlib.Path(__import__('sys').argv[1])
          encoded = (root / 'encoded').read_bytes()
          if not 0 < len(encoded) <= 2097152:
              raise SystemExit('R21 output limit')
          archive = base64.b64decode(encoded, validate=True)
          with gzip.GzipFile(fileobj=io.BytesIO(archive)) as stream:
              unpacked = stream.read(16777217)
          if len(unpacked) > 16777216:
              raise SystemExit('R21 decompression limit')
          with tarfile.open(fileobj=io.BytesIO(unpacked), mode='r:') as package:
              count = total = 0
              for member in package:
                  path = pathlib.PurePosixPath(member.name)
                  count += 1
                  total += member.size
                  if (count > 512 or total > 16777216 or path.is_absolute()
                      or '..' in path.parts or not path.parts or path.parts[0] != 'trial'
                      or not (member.isfile() or member.isdir())):
                      raise SystemExit('R21 archive entry denied')
              if count < 5:
                  raise SystemExit('R21 empty package')
          (root / 'trial.tar.gz').write_bytes(archive)
          print('R21 archive validated:', len(archive), 'bytes;', count, 'entries')
          PYTHON
      - name: Conserver le dossier privé pour revue et reprise
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leo-r21-${{ github.event.pull_request.head.sha }}
          path: ${{ env.LV1_TRIAL_OUTPUT }}/trial.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Lire le paquet R21 exact de la revue croisée
        if: github.head_ref == 'codex/leo-lv1-20260929'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leo-r21-220fb9515291c9e62c076d06e4fa3dc608166db7
          run-id: 36597170079
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/leo-r21-reviewed
      - name: Rééprouver la reprise du paquet revu sans fusion
        if: github.head_ref == 'codex/leo-lv1-20260929'
        run: |
          set -euo pipefail
          LV1_PYTHON_IMAGE="$(cat /tmp/lv1-python-image-id)"
          docker run --rm --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777 \
            --tmpfs /trial-output:rw,nosuid,nodev,noexec,size=128m,mode=1777 \
            --mount type=bind,src="$GITHUB_WORKSPACE/leo",dst=/workspace/leo,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/finubar/leo_control.py",dst=/workspace/finubar/leo_control.py,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/finubar/leo_process.py",dst=/workspace/finubar/leo_process.py,readonly \
            --mount type=bind,src="$RUNNER_TEMP/leo-r21-reviewed/trial.tar.gz",dst=/reviewed.tar.gz,readonly \
            --workdir /workspace \
            --env LV1_ISOLATED=1 --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_GLOBAL=/dev/null --env GIT_CONFIG_NOSYSTEM=1 \
            "$LV1_PYTHON_IMAGE" \
            python -m leo.trial_resume verify /reviewed.tar.gz \
              --sha256 9c0aaa2d718d3fcc4084efdaf998edd2ee0480c67c3c892cbbaf2c69f29869de \
              --destination /trial-output/trial \
              --source-sha 220fb9515291c9e62c076d06e4fa3dc608166db7 \
              --target-sha fb7daac613a0828d4135333fbd27a47102323211 \
              --integration-sha 2c8b70638c73949eb8e5485b0f2280627f5526b3


