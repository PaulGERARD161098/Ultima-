name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Un nouveau push sur une PR annule le passage précédent de CETTE PR : il
# testait une tête déjà dépassée (30/09 : 20 min perdues sur #321). Jamais sur
# main, où chaque fusion est vérifiée jusqu'au bout (groupe = le commit).
# `tests/unit-ci-groupes.mjs` vérifie que cette règle reste en place.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tests unitaires isolés
        run: |
          mkdir -p "$RUNNER_TEMP/lv1-memoire"
          cp memoire/LECONS.md "$RUNNER_TEMP/lv1-memoire/LECONS.md"
          docker pull node:22-bookworm
          image=$(docker image inspect --format '{{.Id}}' node:22-bookworm)
          echo "Image utilisée : $image"
          docker run --rm --pull never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,size=512m \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/travail,readonly" \
            --tmpfs /travail/.git:ro,nosuid,size=1m \
            --mount "type=bind,src=$RUNNER_TEMP/lv1-memoire,dst=/travail/memoire,readonly" \
            --workdir /travail "$image" sh -c 'node tests/lv1-isolation.mjs && npm test'
  browser:
    runs-on: ubuntu-latest
    # 15 min était atteint : le 21/10 (#406) le groupe 0 a fini vert à 14:57 et a été
    # annulé pendant le nettoyage. La limite ne facture rien, une relance si.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        groupe: [0, 1]
    steps:
      # fetch-depth 2 : le commit testé et ses parents, de quoi lire le diff net (la
      # fusion d'une PR a deux parents ; HEAD^1 est sa base).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      # Facture GitHub du 19/10/2026 : Ultima- ≈ 54 % des minutes Actions de
      # l'organisation, et ce harnais = 27 min des 29 facturées par exécution.
      # Aucun harnais navigateur ne lit de `.md` (mesuré : 59 fichiers, 3 données
      # factices, 19 commentaires) : quand seuls des `.md` changent, il ne peut rien
      # apprendre. Le job `unit` tourne TOUJOURS (il garde LECONS.md et le sceau).
      # On saute des ÉTAPES, pas le job : le contrôle reste présent et vert, il
      # n'y a donc jamais de contrôle « en attente ». Toute erreur, tout doute,
      # tout fichier non `.md` → le harnais s'exécute. Gardé par
      # `tests/unit-ci-md-seuls.mjs`, qui exécute CE script tel quel.
      - name: Portée du changement
        id: portee
        run: |
          seuls_md=false
          if fichiers=$(git diff --name-only HEAD^1 HEAD) && [ -n "$fichiers" ]; then
            rc=0
            printf '%s\n' "$fichiers" | grep -qvE '\.md$' || rc=$?
            if [ "$rc" -eq 1 ]; then seuls_md=true; fi
          fi
          if [ "$seuls_md" = true ]; then
            echo "Harnais navigateur sauté : seuls des .md changent."
          else
            echo "Harnais navigateur exécuté."
          fi
          echo "seuls_md=$seuls_md" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.portee.outputs.seuls_md != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.portee.outputs.seuls_md != 'true'
      - name: Harnais navigateur isolé
        if: steps.portee.outputs.seuls_md != 'true'
        run: |
          mkdir -p tests/.cache "$RUNNER_TEMP/lv1-memoire"
          cp memoire/LECONS.md "$RUNNER_TEMP/lv1-memoire/LECONS.md"
          docker pull mcr.microsoft.com/playwright:v1.56.1-noble
          image=$(docker image inspect --format '{{.Id}}' mcr.microsoft.com/playwright:v1.56.1-noble)
          echo "Image utilisée : $image"
          docker run --rm --pull never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 3g --cpus 2 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,size=512m \
            --tmpfs /travail/tests/.cache:rw,nosuid,noexec,size=256m,uid=65534,gid=65534,mode=0700 \
            --env XDG_CONFIG_HOME=/tmp/lv1-config --env XDG_CACHE_HOME=/tmp/lv1-cache \
            --env SMOKE_SHARD_INDEX=${{ matrix.groupe }} --env SMOKE_SHARD_COUNT=2 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/travail,readonly" \
            --tmpfs /travail/.git:ro,nosuid,size=1m \
            --mount "type=bind,src=$RUNNER_TEMP/lv1-memoire,dst=/travail/memoire,readonly" \
            --workdir /travail "$image" sh -c 'mkdir -p /tmp/lv1-config /tmp/lv1-cache && node tests/lv1-isolation.mjs && npm run test:browser'
