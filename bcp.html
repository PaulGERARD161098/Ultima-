<!-- NICOL BOLAS — le pilotage financier (Lv3, boucle L4). L'antichambre en
     colonne a laissé place à la FORME UNIQUE : la boussole. Coque pure — les
     caps, le cœur et la parole de Léo sont rendus par js/boussole-noyau.mjs
     à partir du registre (`data-noeud`). -->
<body class="boussole" data-noeud="nicol-bolas">

  <div class="boussole-scene">

    <!-- Retour à la supra-division ULTIMA (Lv3 : ce quadrant en est un cap). -->
    <p class="console-retour boussole-retour"><a href="grima.html">↞ GRIMA</a></p>

    <!-- ===== Bandeau : sceau du quadrant + identité du nœud ===== -->
    <header class="console-entete boussole-entete">
      <svg class="boussole-sceau" viewBox="0 0 72 72" aria-hidden="true" focusable="false">
        <circle cx="36" cy="36" r="33" fill="#f9f1dc" stroke="#a9884a" stroke-width="2.4"/>
        <circle cx="36" cy="36" r="28.5" fill="none" stroke="#5a4118" stroke-width="1"/>
        <g stroke="#5a4118" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M36 22 V49"/>
          <path d="M20 27 H52"/>
          <path d="M28 51 Q36 47.5 44 51"/>
          <path d="M22 27 L17 37 M22 27 L27 37 M15 37 Q22 45 29 37"/>
          <path d="M50 27 L45 37 M50 27 L55 37 M43 37 Q50 45 57 37"/>
        </g>
        <circle cx="36" cy="22" r="2.6" fill="#3b2f1c"/>
      </svg>

      <h1 class="console-titre console-titre--boussole">
        <span class="titre-surligne">Ultima — quadrant Nicol Bolas</span>
        <span class="titre-principal">Le pilotage financier</span>
      </h1>
    </header>

    <!-- ===== La boussole du quadrant, rendue par le noyau ===== -->
    <main class="boussole-plateau" id="boussole-plateau"
          aria-label="Boussole du quadrant NICOL BOLAS (pilotage financier)">
      <!-- Repli sans JavaScript : les portes ouvertes restent atteignables. -->
      <noscript>
        <ul class="boussole-noscript">
          <li><a href="abaque.html">ABAQUE — le simulateur de lancement</a></li>
          <li>REVENUS &amp; CHARGES — à venir</li>
          <li>IMPÔTS — à venir</li>
          <li>ÉCHÉANCIER — à venir</li>
        </ul>
      </noscript>
    </main>

    <!-- Parole de Léo : l'essentiel du cap survolé (rempli par le noyau). -->
    <aside class="boussole-parole" id="boussole-parole" role="status" aria-live="polite">
    </aside>

  </div>

  <script type="module" src="js/boussole-noyau.mjs"></script>
</body>
</html>
