<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ultima — ULTIMA (le personnel)</title>
  <meta name="description" content="ULTIMA, la supra-division personnelle : deux macro-quadrants autour de la rose — GRIMA (ce qui est utile) et NAGA (ce qui fait grandir).">
  <meta name="theme-color" content="#0e3a52">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231e6fb8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/console.css">
  <link rel="stylesheet" href="css/boussole.css">
</head>
<!-- ULTIMA — supra-division personnelle (Lv3, boucle L2 ; macro-quadrants
     2026-08-01). Deux cadrans cliquables : GRIMA (ce qui est utile) et NAGA
     (ce qui fait grandir). Cette page n'est qu'une coque — les caps, les
     aiguilles, le cœur et la parole de Léo sont rendus par
     js/boussole-noyau.mjs à partir du registre (`data-noeud`). -->
<body class="boussole" data-noeud="ultima-perso">

  <div class="boussole-scene">

    <!-- Retour à la boussole racine (les deux supra-divisions). -->
    <p class="console-retour boussole-retour"><a href="/">↞ Boussole</a></p>

    <!-- ===== Bandeau : sceau ULTIMA (monde-anneau gravé) + identité du nœud ===== -->
    <header class="console-entete boussole-entete">
      <svg class="boussole-sceau" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="sceau-or" cx="38%" cy="32%" r="78%">
            <stop offset="0" stop-color="#f4e6bd"/>
            <stop offset="55%" stop-color="#e3cd93"/>
            <stop offset="100%" stop-color="#cbab63"/>
          </radialGradient>
        </defs>
        <circle cx="60" cy="60" r="55" fill="url(#sceau-or)" stroke="#6e5320" stroke-width="2.6"/>
        <circle cx="60" cy="60" r="49" fill="none" stroke="#6e5320" stroke-width="1" opacity="0.7"/>
        <circle cx="60" cy="60" r="45" fill="none" stroke="#a9884a" stroke-width="0.8"/>
        <!-- couronne de 8 clous gravés sur l'anneau -->
        <g fill="#6e5320">
          <circle cx="60" cy="8.5" r="1.7"/>
          <circle cx="60" cy="111.5" r="1.7"/>
          <circle cx="8.5" cy="60" r="1.7"/>
          <circle cx="111.5" cy="60" r="1.7"/>
          <circle cx="96.4" cy="23.6" r="1.5"/>
          <circle cx="23.6" cy="23.6" r="1.5"/>
          <circle cx="96.4" cy="96.4" r="1.5"/>
          <circle cx="23.6" cy="96.4" r="1.5"/>
        </g>
        <!-- emblème central : monde-anneau + rayons (encre sépia) -->
        <g stroke="#4a3512" fill="none" stroke-linecap="round">
          <circle cx="60" cy="60" r="17" stroke-width="2.4"/>
          <circle cx="60" cy="60" r="8.5" stroke-width="1.6"/>
          <path d="M60 40 L60 30 M60 80 L60 90 M80 60 L90 60 M40 60 L30 60
                   M74.1 45.9 L81.2 38.8 M45.9 45.9 L38.8 38.8
                   M74.1 74.1 L81.2 81.2 M45.9 74.1 L38.8 81.2" stroke-width="1.4"/>
        </g>
        <circle cx="60" cy="60" r="2.1" fill="#4a3512"/>
      </svg>

      <h1 class="console-titre console-titre--boussole">
        <span class="titre-surligne">Supra-division Ultima</span>
        <span class="titre-principal">ULTIMA</span>
      </h1>
      <p class="console-invite">Léo te guide&nbsp;— survole un cap.</p>
    </header>

    <!-- ===== La boussole des deux macro-quadrants, rendue par le noyau ===== -->
    <main class="boussole-plateau" id="boussole-plateau"
          aria-label="Boussole de la supra-division personnelle ULTIMA">
      <!-- Repli sans JavaScript : les deux cadrans restent atteignables. -->
      <noscript>
        <ul class="boussole-noscript">
          <li><a href="grima.html">GRIMA — ce qui est utile (RIVEN, NICOL BOLAS)</a></li>
          <li><a href="naga.html">NAGA — ce qui fait grandir (IMLADRIK, ADRAMELECH, TAO)</a></li>
        </ul>
      </noscript>
    </main>

    <!-- Parole de Léo : l'essentiel du cap survolé (rempli par le noyau). -->
    <aside class="boussole-parole" id="boussole-parole" role="status" aria-live="polite">
      <p class="parole-defaut">Survole un cap&nbsp;— Léo t'en dit l'essentiel.</p>
    </aside>

  </div>

  <script type="module" src="js/boussole-noyau.mjs"></script>
</body>
</html>
