  <link rel="stylesheet" href="css/styles.css">

  <!-- LV5 — le ciel. `ciel.css` est réemployée telle quelle (même scène, même
       étoile qu'à RIVEN) ; `stellaire.css` vient EN DERNIER car elle redéfinit
       les jetons de `styles.css`. `boussole.css` RESTE chargée : le retour, le

<!-- NAGA — macro-quadrant « ce qui fait grandir » (dicté par Paul le
     2026-08-01) : le cadran cliquable qui rassemble IMLADRIK, ADRAMELECH et
     TAO entre la supra-division ULTIMA et ses quadrants. Coque pure — caps,
     aiguilles, cœur et parole de Léo sont rendus par js/boussole-noyau.mjs. -->
<body class="ciel-noeud" data-noeud="naga">

  <div class="ciel-noeud-coque">

    <!-- Retour à la supra-division ULTIMA (NAGA en est un cap). -->
    <p class="console-retour boussole-retour"><a href="ultima.html">↞ ULTIMA</a></p>

    <!-- ===== Bandeau : sceau NAGA (la pousse gravée — ce qui grandit) ===== -->
    <header class="console-entete boussole-entete">
      <svg class="boussole-sceau" viewBox="0 0 72 72" aria-hidden="true" focusable="false">
        <circle cx="36" cy="36" r="33" fill="#f9f1dc" stroke="#a9884a" stroke-width="2.4"/>
        <circle cx="36" cy="36" r="28.5" fill="none" stroke="#5a4118" stroke-width="1"/>
        <path d="M36 56 C 36 46, 36 36, 36 26" stroke="#3b2f1c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M36 40 C 28 40, 22 35, 21 26 C 29 26, 35 31, 36 40 Z" fill="#3b2f1c"/>
        <path d="M36 33 C 44 33, 50 28, 51 19 C 43 19, 37 24, 36 33 Z" fill="#3b2f1c"/>
        <path d="M36 26 C 34 22, 34 19, 36 15 C 38 19, 38 22, 36 26 Z" fill="#a9884a"/>
        <path d="M22 58 H 50" stroke="#3b2f1c" stroke-width="2" stroke-linecap="round"/>
        <path d="M25 29 C 30 31, 33 34, 35 38" stroke="#e0c48a" stroke-width="0.8" fill="none" opacity="0.8"/>
      </svg>

      <h1 class="console-titre console-titre--boussole">
        <span class="titre-surligne">Ce qui fait grandir</span>
        <span class="titre-principal">NAGA</span>
      </h1>
    </header>

    <!-- ===== La boussole des trois caps de croissance, rendue par le noyau ===== -->
    <div class="ciel-noeud-plateau" id="ciel-noeud-plateau">
      <main class="ciel-scene" id="ciel-noeud-scene"
            aria-label="Boussole du macro-quadrant NAGA : ce qui fait grandir">
      </main>
      <!-- Le repli sans JavaScript vit DANS LE PLATEAU, à côté de la scène :
           le moteur vide la scène à chaque dessin. -->
      <!-- Repli sans JavaScript : les portes restent atteignables. -->
      <noscript>
        <ul class="boussole-noscript">
          <li><a href="imladrik.html">IMLADRIK — le développement personnel</a></li>
          <li><a href="adramelech.html">ADRAMELECH — la bibliothèque d'idées</a></li>
          <li><a href="tao.html">TAO — la voie : le réel et l'idéal</a></li>
        </ul>
      </noscript>
    </div>

    <!-- Parole de Léo : l'essentiel du cap survolé (rempli par le noyau). -->
    <aside class="boussole-parole" id="boussole-parole" role="status" aria-live="polite">
    </aside>

  </div>

  <!-- LV5 — la couche de fond AVANT le moteur : celui-ci la cherche en global au
       moment du rendu, et son garde laisserait la page vivre SANS fond et sans
       rien dire (défaut payé sur P1). Le harnais exige donc le canvas. -->
  <script src="js/ciel-fond.js"></script>
  <script src="js/ciel.js"></script>
  <script type="module" src="js/ciel-noeud.mjs"></script>
  <script src="js/vendor/supabase-js-2.110.0.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/leo-accueil.js"></script>
  <script src="js/leo-partout.js"></script>
</body>
</html>
