<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultima — Preview · Blason ADRAMELECH, trois ouroboros</title>
<!-- Preview de choix (Paul, 2026-07-18) : l'emblème ADRAMELECH devient un
     ouroboros. Trois gravures proposées, même registre que les médaillons de
     la console (parchemin, encre sépia, rehauts d'or). Fichier de design,
     jamais servi en public. -->
<style>
  body { margin:0; padding:40px 24px; background:#0e3a52; color:#f4ead2;
         font-family: Georgia, 'Times New Roman', serif; text-align:center; }
  h1 { font-size:22px; letter-spacing:.08em; font-weight:normal; margin:0 0 6px; }
  p.note { font-style:italic; opacity:.8; margin:0 0 34px; font-size:14px; }
  .rangee { display:flex; justify-content:center; gap:48px; flex-wrap:wrap; }
  figure { margin:0; }
  svg { width:200px; height:200px; display:block; }
  figcaption { margin-top:14px; font-size:15px; letter-spacing:.05em; }
  figcaption b { display:block; font-size:20px; margin-bottom:4px; color:#e0c48a; }
</style>
</head>
<body>
<h1>BLASON ADRAMELECH — L'OUROBOROS</h1>
<p class="note">Trois gravures au choix, même registre que les autres médaillons.</p>
<div class="rangee">

<figure>
  <svg viewBox="0 0 72 72" role="img" aria-label="Ouroboros A : l'anneau pur">
    <circle cx="36" cy="36" r="33" fill="#f9f1dc" stroke="#a9884a" stroke-width="2.4"/>
    <circle cx="36" cy="36" r="28.5" fill="none" stroke="#5a4118" stroke-width="1"/>
    <!-- Corps : anneau presque complet, la gueule rejoint la queue en haut. -->
    <path d="M34.78 22.05 A14 14 0 1 0 37.22 22.05"
          fill="none" stroke="#3b2f1c" stroke-width="3" stroke-linecap="round"/>
    <!-- Écailles : tailles gravées en travers de l'anneau. -->
    <g stroke="#3b2f1c" stroke-width="0.7" opacity="0.5">
      <path d="M25.1 29.7 L22.7 28.3"/><path d="M23.6 33.8 L20.8 33.3"/>
      <path d="M23.6 38.2 L20.8 38.7"/><path d="M25.1 42.3 L22.7 43.7"/>
      <path d="M27.9 45.7 L26.1 47.8"/><path d="M31.7 47.8 L30.7 50.5"/>
      <path d="M36 48.6 L36 51.4"/><path d="M40.3 47.8 L41.3 50.5"/>
      <path d="M44.1 45.7 L45.9 47.8"/><path d="M46.9 42.3 L49.3 43.7"/>
      <path d="M48.4 38.2 L51.2 38.7"/><path d="M48.4 33.8 L51.2 33.3"/>
      <path d="M46.9 29.7 L49.3 28.3"/>
    </g>
    <!-- Queue effilée entrant dans la gueule. -->
    <path d="M37.2 20.9 L41.2 23 L37.6 23.7 Z" fill="#3b2f1c"/>
    <!-- Tête : gueule refermée sur la queue. -->
    <path d="M31.4 21.8 C 32.4 19.5, 35.4 18.7, 38 19.9 L 40.6 21.3 L 38.8 22.1
             L 40.4 23.5 L 36.8 23.9 C 33.9 24.3, 31.9 23.4, 31.4 21.8 Z"
          fill="#3b2f1c"/>
    <circle cx="34.3" cy="21.3" r="0.9" fill="#e0c48a"/>
    <!-- Rehaut d'or : fil intérieur du cycle. -->
    <circle cx="36" cy="36" r="11.6" fill="none" stroke="#e0c48a"
            stroke-width="0.8" opacity="0.55"/>
  </svg>
  <figcaption><b>A</b>L'anneau pur<br>écailles gravées, fil d'or intérieur</figcaption>
</figure>

<figure>
  <svg viewBox="0 0 72 72" role="img" aria-label="Ouroboros B : l'ailé">
    <circle cx="36" cy="36" r="33" fill="#f9f1dc" stroke="#a9884a" stroke-width="2.4"/>
    <circle cx="36" cy="36" r="28.5" fill="none" stroke="#5a4118" stroke-width="1"/>
    <!-- Aile membranée dressée (clin d'œil au dragon des manuscrits alchimiques). -->
    <g fill="none" stroke="#3b2f1c" stroke-width="1.4" stroke-linejoin="round">
      <path d="M30 24.5 C 26.5 17.5, 21 12.8, 13.5 12.3
               C 15.7 15.2, 15.1 17.8, 12.8 19.6
               C 16.3 20, 18.4 22.2, 17.6 25.3
               C 20.7 24.3, 23.6 25.7, 25 28.6
               C 26.5 26.5, 28.3 25.3, 30 25.5 Z"/>
    </g>
    <g fill="none" stroke="#3b2f1c" stroke-width="0.9" opacity="0.85">
      <path d="M29.4 24.8 C 25 20.6, 19.8 16.2, 14.4 13.8"/>
      <path d="M29.4 25.4 C 24.6 22.8, 19.4 20.8, 13.8 19.8"/>
    </g>
    <!-- Corps : anneau, gueule sur la queue. -->
    <path d="M34.78 22.05 A14 14 0 1 0 37.22 22.05"
          fill="none" stroke="#3b2f1c" stroke-width="3" stroke-linecap="round"/>
    <path d="M37.2 20.9 L41.2 23 L37.6 23.7 Z" fill="#3b2f1c"/>
    <path d="M31.4 21.8 C 32.4 19.5, 35.4 18.7, 38 19.9 L 40.6 21.3 L 38.8 22.1
             L 40.4 23.5 L 36.8 23.9 C 33.9 24.3, 31.9 23.4, 31.4 21.8 Z"
          fill="#3b2f1c"/>
    <!-- Petites cornes. -->
    <path d="M32.8 20.2 L 33.6 17.4 L 34.9 19.8 Z" fill="#3b2f1c"/>
    <circle cx="34.3" cy="21.3" r="0.9" fill="#e0c48a"/>
    <path d="M43 47.5 A14 14 0 0 0 49.8 39" fill="none" stroke="#e0c48a"
          stroke-width="0.8" opacity="0.6"/>
  </svg>
  <figcaption><b>B</b>L'ailé<br>l'ouroboros des manuscrits alchimiques</figcaption>
</figure>

<figure>
  <svg viewBox="0 0 72 72" role="img" aria-label="Ouroboros C : l'étincelle au cœur">
    <circle cx="36" cy="36" r="33" fill="#f9f1dc" stroke="#a9884a" stroke-width="2.4"/>
    <circle cx="36" cy="36" r="28.5" fill="none" stroke="#5a4118" stroke-width="1"/>
    <!-- Corps : anneau, gueule sur la queue. -->
    <path d="M34.78 22.05 A14 14 0 1 0 37.22 22.05"
          fill="none" stroke="#3b2f1c" stroke-width="3" stroke-linecap="round"/>
    <path d="M37.2 20.9 L41.2 23 L37.6 23.7 Z" fill="#3b2f1c"/>
    <path d="M31.4 21.8 C 32.4 19.5, 35.4 18.7, 38 19.9 L 40.6 21.3 L 38.8 22.1
             L 40.4 23.5 L 36.8 23.9 C 33.9 24.3, 31.9 23.4, 31.4 21.8 Z"
          fill="#3b2f1c"/>
    <circle cx="34.3" cy="21.3" r="0.9" fill="#e0c48a"/>
    <!-- L'étincelle au cœur du cycle : l'idée. -->
    <path d="M36 29.2 L 37.7 34.3 L 42.8 36 L 37.7 37.7 L 36 42.8 L 34.3 37.7
             L 29.2 36 L 34.3 34.3 Z" fill="#3b2f1c"/>
    <path d="M36 32.4 L 36.9 35.1 L 39.6 36 L 36.9 36.9 L 36 39.6 L 35.1 36.9
             L 32.4 36 L 35.1 35.1 Z" fill="none" stroke="#e0c48a"
          stroke-width="0.8" opacity="0.85"/>
    <!-- Pointillé d'or : le cycle qui nourrit l'étincelle. -->
    <circle cx="36" cy="36" r="10.8" fill="none" stroke="#e0c48a"
            stroke-width="0.8" opacity="0.5" stroke-dasharray="1 3"/>
  </svg>
  <figcaption><b>C</b>L'étincelle au cœur<br>le cycle qui nourrit l'idée</figcaption>
</figure>

</div>
</body>
</html>
