<!--
  MAQUETTE DE TRAVAIL — lot 2 de CADRAGE-2026-09-25-carte-celeste.md (§14.2).
  Vrai moteur (js/ciel.js), vrai registre (js/registre-lv3.mjs), vrai adaptateur
  (js/adaptateur-lv4.mjs), vraie greffe (js/adaptateur-finubar.mjs). Les dépôts
  viennent d'une FIXTURE INVENTÉE (preview-accueil-finubar-fixture.mjs) : design/

  Elle sert à trancher A8, et c'est Paul qui tranche, sur capture :

    V2 — la figure irrégulière + l'arbre + l'éclat par le rang.

-->

<body>
<header class="mq-barre">
  <h1 class="mq-titre">Carte céleste</h1>
  <nav class="mq-groupe" aria-label="Écran">
    <button type="button" class="mq-bouton" data-ecran="ultima">ULTIMA</button>
    <button type="button" class="mq-bouton" data-ecran="naga">NAGA</button>
    <button type="button" class="mq-bouton" data-ecran="grima">GRIMA</button>
    <button type="button" class="mq-bouton" data-ecran="racine">Racine</button>
    <button type="button" class="mq-bouton" data-ecran="alpha">ALPHA</button>
    <button type="button" class="mq-bouton" data-ecran="renoboost">RENOBOOST IA</button>
    <button type="button" class="mq-bouton" data-ecran="pire">Pire cas · 24</button>
  </nav>
  <div class="mq-groupe" role="group" aria-label="Variante">
    <button type="button" class="mq-bouton" data-variante="v0">Aujourd’hui</button>
    <button type="button" class="mq-bouton" data-variante="v1">V1 couronne</button>
    <button type="button" class="mq-bouton" data-variante="v2">V2 figure</button>
  </div>
</header>
<main class="mq-scene-cadre">
  <p id="mq-legende" class="mq-legende"></p>

<footer class="mq-mesure">

  <table id="mq-table" hidden></table>
</footer>
<script src="../js/ciel-fond.js"></script>
<script src="../js/ciel.js"></script>
<script type="module" src="preview-carte-celeste.js"></script>
