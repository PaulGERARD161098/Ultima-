<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ultima — ALPHA (le professionnel)</title>
  <meta name="description" content="ALPHA, la supra-division professionnelle : les projets qui font vivre — Renoboost IA et YCOME.">
  <meta name="theme-color" content="#0e3a52">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231e6fb8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/console.css">
  <link rel="stylesheet" href="css/boussole.css">
</head>
<!-- ALPHA — supra-division professionnelle (Lv3, boucle L2). Coque pure : les
     caps, les aiguilles, le cœur et la parole de Léo sont rendus par
     js/boussole-noyau.mjs à partir du registre (`data-noeud`). Aucune donnée
     dans cette page : les projets d'ALPHA sont des plateformes externes. -->
<body class="boussole" data-noeud="alpha">

  <div class="boussole-scene">

    <!-- Retour à la boussole racine (les deux supra-divisions). -->
    <p class="console-retour boussole-retour"><a href="/">↞ Boussole</a></p>

    <!-- ===== Bandeau : sceau ALPHA (la capitale grecque gravée) ===== -->
    <header class="console-entete boussole-entete">
      <svg class="boussole-sceau" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="sceau-alpha-or" cx="38%" cy="32%" r="78%">
            <stop offset="0" stop-color="#f4e6bd"/>
            <stop offset="55%" stop-color="#e3cd93"/>
            <stop offset="100%" stop-color="#cbab63"/>
          </radialGradient>
        </defs>
        <circle cx="60" cy="60" r="55" fill="url(#sceau-alpha-or)" stroke="#6e5320" stroke-width="2.6"/>
        <circle cx="60" cy="60" r="49" fill="none" stroke="#6e5320" stroke-width="1" opacity="0.7"/>
        <circle cx="60" cy="60" r="45" fill="none" stroke="#a9884a" stroke-width="0.8"/>
        <g fill="#6e5320">
          <circle cx="60" cy="8.5" r="1.7"/>
          <circle cx="60" cy="111.5" r="1.7"/>
          <circle cx="8.5" cy="60" r="1.7"/>
          <circle cx="111.5" cy="60" r="1.7"/>
        </g>
        <!-- L'alpha : la première lettre, sur son stylobate d'or. -->
        <g fill="none" stroke="#4a3512" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M38 84 L 60 30 L 82 84"/>
          <path d="M47 65 H 73"/>
        </g>
        <path d="M32 94 H 88" stroke="#a9884a" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
        <path d="M36 30 q 24 -12 48 0" fill="none" stroke="#a9884a" stroke-width="1.8" opacity="0.6"/>
      </svg>

      <h1 class="console-titre console-titre--boussole">
        <span class="titre-surligne">Supra-division Alpha</span>
        <span class="titre-principal">ALPHA</span>
      </h1>
    </header>

    <!-- ===== La boussole d'ALPHA, rendue par le noyau ===== -->
    <main class="boussole-plateau" id="boussole-plateau"
          aria-label="Boussole de la supra-division professionnelle ALPHA">
      <!-- Repli sans JavaScript : la porte ouverte reste atteignable. -->
      <noscript>
        <ul class="boussole-noscript">
          <li><a href="https://www.renoboostia.fr" rel="noopener noreferrer">Renoboost IA — la console</a></li>
          <li>YCOME — à venir</li>
        </ul>
      </noscript>
    </main>

    <!-- Parole de Léo : l'essentiel du cap survolé (rempli par le noyau). -->
    <aside class="boussole-parole" id="boussole-parole" role="status" aria-live="polite">
    </aside>

  </div>

  <script type="module" src="js/boussole-noyau.mjs"></script>
</body>
</html>
