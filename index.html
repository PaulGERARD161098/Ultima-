<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` (LV5 / P2) : sans lui, les `env(safe-area-inset-*)`
       valent zéro et la barre système d'iOS recouvre le bas du ciel. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ultima — Boussole</title>
  <meta name="description" content="Boussole d'accueil d'Ultima : deux supra-divisions — ULTIMA (le personnel) et ALPHA (le professionnel) — et ALTHEA, le Système. Léo en dépose l'essentiel au survol.">
  <meta name="theme-color" content="#070d18">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231e6fb8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/console.css">
  <link rel="stylesheet" href="css/boussole.css">
  <!-- LV5 / P4 — LA RACINE PASSE AU CIEL (étape ④c de CADRAGE-LV4, en dernier,
       sur un module éprouvé huit fois). `ciel.css` est réemployée telle quelle ;
       `stellaire.css` vient EN DERNIER car elle redéfinit les jetons de
       `styles.css` : c'est ainsi que le thème s'applique sans qu'aucune des
       feuilles précédentes soit modifiée. -->
  <link rel="stylesheet" href="css/ciel.css">
  <link rel="stylesheet" href="css/ciel-noeud.css">
  <link rel="stylesheet" href="css/stellaire.css">
  <!-- P3 — le bandeau Finubar. Après `stellaire.css` : il lit ses jetons
       d'appel (§⑨) et ne redéfinit rien. -->
  <link rel="stylesheet" href="css/finubar-bandeau.css">
  <link rel="stylesheet" href="css/leo.css">
</head>
<!-- LA RACINE — l'écran que Paul juge (LV5 / P4). Dernière page à passer de
     la boussole au ciel : la galaxie EST désormais l'accueil, le bandeau
     « Bienvenue » et l'invite deviennent du HUD. La page reste une coque (ni
     SVG de cap ni logique) ET reste la porte d'entrée unique : l'écran de
     connexion (z-index 2000) couvre le ciel tant qu'aucune session n'est
     ouverte — js/boussole-auth.js n'a pas bougé d'une ligne. -->
<body class="ciel-noeud" data-noeud="racine">

  <!-- ===== Écran de connexion plein écran (porte d'entrée unique LV2) =====
       Piloté par js/boussole-auth.js : visible tant qu'aucune session n'est
       ouverte (config présente). C'est ici que se termine le retour Google /
       lien magique. Overlay et styles réutilisés de riven.html (mêmes id
       #ecran-connexion / #form-connexion / #champ-email / #bouton-google,
       css/styles.css). Décor SVG inline, muet (aria-hidden). -->
  <div id="ecran-connexion" class="ecran-connexion" hidden>
    <!-- LE DÉCOR EST LE CIEL (02/09/2026). Il portait une carte antique dessinée
         — mer moirée, terres ocre, rose des vents — héritée de l'accueil d'avant
         LV5. L'outil, lui, EST devenu le ciel : garder ici la mer d'une carte
         que plus aucune page ne montre, c'était faire entrer Paul par une porte
         qui ne donne pas sur la maison.
         Vide dans le document : le champ d'étoiles y est monté par
         `js/ecran-connexion-ciel.js`, avec le MÊME peintre que les huit coques
         (`js/ciel-fond.js`). Un second champ écrit à côté aurait divergé du
         premier au premier réglage. Sans JavaScript, il n'y a donc pas de
         décor — et c'est le bon défaut : la porte, elle, reste entière. -->
    <div class="ecran-decor" aria-hidden="true"></div>

    <header class="ecran-cartouche">
      <h1 class="ecran-titre">ULTIMA</h1>
      <p class="ecran-sous">votre interface unique</p>
    </header>

    <main class="ecran-corps">
      <form id="form-connexion" class="form-connexion ecran-parchemin" hidden>
        <h2 class="ecran-accroche">Connexion</h2>
        <label class="ecran-label" for="champ-email">Adresse e-mail</label>
        <input id="champ-email" type="email" required autocomplete="email" inputmode="email"
               placeholder="votre@email.fr">
        <button type="submit" class="bouton bouton-lien-magique">Recevoir le lien</button>
        <p class="ecran-aide">Aucun mot de passe : un lien de connexion vous est adressé par e-mail.</p>
        <div class="ecran-separateur" role="separator" aria-hidden="true"><span>ou</span></div>
        <button id="bouton-google" type="button" class="bouton bouton-google">Se connecter avec Google</button>
      </form>
    </main>
  </div>

  <!-- `boussole-scene` est CONSERVÉE à côté de `ciel-noeud-coque`, et c'est un
       choix, pas un oubli : c'est la POIGNÉE de js/boussole-auth.js — la scène
       qu'il rend inerte tant que la porte est fermée. La garder évite de
       toucher au module d'auth (surface sous gate). Ses règles de layout sont
       neutralisées par `ciel-noeud.css`, chargée après `boussole.css`. -->
  <div class="ciel-noeud-coque boussole-scene">

    <!-- ===== Bandeau : sceau ULTIMA + accueil + invite ===== -->
    <header class="console-entete boussole-entete">
      <!-- Sceau ULTIMA : médaillon d'or gravé (emblème « monde-anneau »). Décor pur. -->
      <svg class="boussole-sceau" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="sceau-or" cx="38%" cy="32%" r="78%">
            <stop offset="0" stop-color="#f4e6bd"/>
            <stop offset="55%" stop-color="#e3cd93"/>
            <stop offset="100%" stop-color="#cbab63"/>
          </radialGradient>
        </defs>
        <circle cx="60" cy="60" r="55" fill="url(#sceau-or)" stroke="#6e5320" stroke-width="2.6"/>
        <circle cx="60" cy="60" r="49" fill="none" stroke="#6e5320" stroke-width="1" opacity="0.7"/>
        <circle cx="60" cy="60" r="45" fill="none" stroke="#a9884a" stroke-width="0.8"/>
        <g fill="#6e5320">
          <circle cx="60" cy="8.5" r="1.7"/>
          <circle cx="60" cy="111.5" r="1.7"/>
          <circle cx="8.5" cy="60" r="1.7"/>
          <circle cx="111.5" cy="60" r="1.7"/>
          <circle cx="96.4" cy="23.6" r="1.5"/>
          <circle cx="23.6" cy="23.6" r="1.5"/>
          <circle cx="96.4" cy="96.4" r="1.5"/>
          <circle cx="23.6" cy="96.4" r="1.5"/>
        </g>
        <g stroke="#4a3512" fill="none" stroke-linecap="round">
          <circle cx="60" cy="60" r="17" stroke-width="2.4"/>
          <circle cx="60" cy="60" r="8.5" stroke-width="1.6"/>
          <path d="M60 40 L60 30 M60 80 L60 90 M80 60 L90 60 M40 60 L30 60
                   M74.1 45.9 L81.2 38.8 M45.9 45.9 L38.8 38.8
                   M74.1 74.1 L81.2 81.2 M45.9 74.1 L38.8 81.2" stroke-width="1.4"/>
        </g>
        <circle cx="60" cy="60" r="2.1" fill="#4a3512"/>
      </svg>

      <h1 class="console-titre console-titre--boussole">
        <span class="titre-surligne">Ultima Lv3</span>
        <span class="titre-principal">Bienvenue</span>
      </h1>
      <p class="console-invite">Sur quoi est-ce qu'on travaille aujourd'hui&nbsp;?</p>
    </header>

    <!-- ===== Le ciel d'accueil, rendu par js/ciel-noeud.mjs =====
         LA SCÈNE EST VIDÉE À CHAQUE DESSIN par le moteur du ciel
         (`textContent = ''`). Tout ce qui doit lui survivre — le filigrane, la
         légende gravée, et le repli <noscript> ci-dessous — vit dans le
         PLATEAU, à côté de la scène. -->
    <div class="ciel-noeud-plateau" id="ciel-noeud-plateau">
      <main class="ciel-scene" id="ciel-noeud-scene"
            aria-label="Ciel d'accueil d'Ultima : ses deux supra-divisions et ALTHEA">
      </main>
      <!-- Repli sans JavaScript : TOUTES les portes restent ouvertes
           (invariant Lv3 §2). -->
      <noscript>
        <ul class="boussole-noscript">
          <li><a href="ultima.html">ULTIMA — les projets personnels</a></li>
          <li><a href="alpha.html">ALPHA — les projets professionnels</a></li>
          <li><a href="althea.html">ALTHEA — le Système (tes skills, tes stats)</a></li>
        </ul>
      </noscript>
    </div>

    <!-- Parole de Léo : l'essentiel du cap survolé (rempli par le noyau). -->
    <aside class="boussole-parole" id="boussole-parole" role="status" aria-live="polite">
    </aside>

    <!-- FINUBAR — l'état des huit dépôts, en bas de l'accueil (P3, 02/09/2026).
         VIDE au chargement, et il le reste tant que la session n'a rien livré :
         `js/ciel-noeud.mjs` le remplit quand `/api/finubar` a répondu, et
         `.fb-bandeau:empty` le fait disparaître d'ici là. Un cadre vide qui
         attend de la donnée dit qu'il manque quelque chose ; l'absence, non.
         ⛔ Il est DÉCLARÉ au moteur du ciel (`margesUtiles`) : sans cela, une
         étoile tombée dans le tiers bas serait peinte mais plus cliquable — le
         clic atterrirait sur un bouton du bandeau, et l'écran RÉPONDRAIT en se
         trompant. Défaut mesuré sur la maquette le 02/09. -->
    <div class="fb-bandeau" id="finubar-bandeau" aria-label="Finubar — l'état des projets"></div>

  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- LV5 — la couche de fond, AVANT le moteur : celui-ci la cherche en global
       au moment du rendu (le garde `window.UltimaCielFond` laisserait la page
       fonctionner sans fond, SANS RIEN DIRE — leçon de P1). -->
  <script src="js/ciel-fond.js"></script>
  <!-- Le champ d'étoiles de la porte d'entrée (02/09) : le peintre commun,
       puis le module qui le monte dans l'écran de connexion à sa première
       ouverture. Aucun effet sur les pages qui ne portent pas cet écran. -->
  <script src="js/ciel-fond-page.js"></script>
  <script src="js/ecran-connexion-ciel.js"></script>
  <script src="js/ciel.js"></script>
  <script src="js/vendor/supabase-js-2.110.0.min.js"></script>
  <script src="js/config.js"></script>
  <!-- Le module du ciel AVANT boussole-auth.js : il pose son hook cockpit
       (window.UltimaBoussole, alias d'UltimaCielNoeud) pendant son évaluation,
       donc il existe déjà quand boussole-auth livre la session (le résumé
       vivant). Module et script defer s'exécutent dans l'ordre du document. -->
  <script type="module" src="js/ciel-noeud.mjs"></script>
  <script src="js/boussole-auth.js" defer></script>
  <script src="js/leo-accueil.js"></script>
  <script src="js/leo-partout.js"></script>
</body>
</html>
