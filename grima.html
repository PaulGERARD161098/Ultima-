<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Ultima — GRIMA (ce qui est utile)</title>
  <meta name="description" content="GRIMA, macro-quadrant d'ULTIMA — ce qui est utile : RIVEN (le réseau commercial) et NICOL BOLAS (le pilotage financier).">
  <meta name="theme-color" content="#0e3a52">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231e6fb8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/console.css">
  <link rel="stylesheet" href="css/boussole.css">
  <!-- LV5 — le ciel. `ciel.css` est réemployée telle quelle (même scène, même
       étoile qu'à RIVEN) ; `stellaire.css` vient EN DERNIER car elle redéfinit
       les jetons de `styles.css`. `boussole.css` RESTE chargée : le retour, le
       bandeau, le sceau et le cartouche de parole lui doivent leur habillage. -->
  <link rel="stylesheet" href="css/ciel.css">
  <link rel="stylesheet" href="css/ciel-noeud.css">
  <link rel="stylesheet" href="css/stellaire.css">
  <link rel="stylesheet" href="css/leo.css">
</head>
<!-- GRIMA — macro-quadrant « ce qui est utile » (dicté par Paul le 2026-08-01) :
     le cadran cliquable qui rassemble RIVEN et NICOL BOLAS entre la
     supra-division ULTIMA et ses quadrants. Coque pure — caps, aiguilles,
     cœur et parole de Léo sont rendus par js/boussole-noyau.mjs (`data-noeud`). -->
<body class="ciel-noeud" data-noeud="grima">

  <div class="ciel-noeud-coque">

    <!-- Retour à la supra-division ULTIMA (GRIMA en est un cap). -->
    <p class="console-retour boussole-retour"><a href="ultima.html">↞ ULTIMA</a></p>

    <!-- ===== Bandeau : sceau GRIMA (l'ancre gravée — l'utile qui tient) ===== -->
    <header class="console-entete boussole-entete">
      <svg class="boussole-sceau" viewBox="0 0 72 72" aria-hidden="true" focusable="false">
        <circle cx="36" cy="36" r="33" fill="#f9f1dc" stroke="#a9884a" stroke-width="2.4"/>
        <circle cx="36" cy="36" r="28.5" fill="none" stroke="#5a4118" stroke-width="1"/>
        <circle cx="36" cy="17" r="4" fill="none" stroke="#3b2f1c" stroke-width="2.2"/>
        <path d="M36 21 V 52" stroke="#3b2f1c" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M26 28 H 46" stroke="#3b2f1c" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M20 41 C 22 49, 28 54, 36 55 C 44 54, 50 49, 52 41" fill="none" stroke="#3b2f1c" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M21 42 L 15.5 46.5 L 23.5 48.5 Z" fill="#3b2f1c"/>
        <path d="M51 42 L 56.5 46.5 L 48.5 48.5 Z" fill="#3b2f1c"/>
        <path d="M36 24 V 50" stroke="#e0c48a" stroke-width="0.8" opacity="0.7"/>
      </svg>

      <h1 class="console-titre console-titre--boussole">
        <span class="titre-surligne">Ce qui est utile</span>
        <span class="titre-principal">GRIMA</span>
      </h1>
    </header>

    <!-- ===== La boussole des deux caps utiles, rendue par le noyau ===== -->
    <div class="ciel-noeud-plateau" id="ciel-noeud-plateau">
      <main class="ciel-scene" id="ciel-noeud-scene"
            aria-label="Boussole du macro-quadrant GRIMA : ce qui est utile">
      </main>
      <!-- Le repli sans JavaScript vit DANS LE PLATEAU, à côté de la scène :
           le moteur vide la scène à chaque dessin. -->
      <!-- Repli sans JavaScript : les portes restent atteignables. -->
      <noscript>
        <ul class="boussole-noscript">
          <li><a href="riven.html">RIVEN — le réseau commercial</a></li>
          <li><a href="bcp.html">NICOL BOLAS — le pilotage financier</a></li>
        </ul>
      </noscript>
    </div>

    <!-- Parole de Léo : l'essentiel du cap survolé (rempli par le noyau). -->
    <aside class="boussole-parole" id="boussole-parole" role="status" aria-live="polite">
    </aside>

  </div>

  <!-- LV5 — la couche de fond AVANT le moteur : celui-ci la cherche en global au
       moment du rendu, et son garde laisserait la page vivre SANS fond et sans
       rien dire (défaut payé sur P1). Le harnais exige donc le canvas. -->
  <script src="js/ciel-fond.js"></script>
  <script src="js/ciel.js"></script>
  <script type="module" src="js/ciel-noeud.mjs"></script>
  <script src="js/vendor/supabase-js-2.110.0.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/leo-accueil.js"></script>
  <script src="js/leo-partout.js"></script>
</body>
</html>
